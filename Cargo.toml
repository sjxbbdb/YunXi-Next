[workspace]
members = [
    "crates/yunxi-companion",
    "crates/yunxi-companion-mailbox",
    "crates/yunxi-composition",
    "crates/yunxi-cordis-core",
    "crates/yunxi-cordis-runtime",
    "crates/yunxi-cli",
    "crates/yunxi-context",
    "crates/yunxi-kernel",
    "crates/yunxi-agent-spine",
    "crates/yunxi-memory",
    "crates/yunxi-multi-agent",
    "crates/yunxi-model-openai",
    "crates/yunxi-persona",
    "crates/yunxi-plugin-host",
    "crates/yunxi-protocol",
    "crates/yunxi-scheduler",
    "crates/yunxi-secret-broker",
    "crates/yunxi-settings",
    "crates/yunxi-storage",
    "crates/yunxi-tool-shell",
    "crates/yunxi-tool-patch",
    "crates/yunxi-tool-files",
    "crates/yunxi-tool-mcp",
    "crates/yunxi-tool-skills",
    "crates/yunxi-voice",
    "crates/yunxi-weixin",
    "crates/yunxi-web-gateway",
    "crates/yunxi-web-contract",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
crossterm = "0.28.1"
getrandom = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
